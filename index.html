<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arovia - Login & Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        aroviaMaroon: '#4a1525',
                        aroviaDarkMaroon: '#320d18',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#f8f5f6] min-h-screen flex items-center justify-center p-4 bg-cover bg-center" style="background-image: linear-gradient(rgba(74, 21, 37, 0.4), rgba(50, 13, 24, 0.6)), url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1600&q=80')">

    <div class="bg-white/95 backdrop-blur-xl w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-white/40">
        <div class="bg-aroviaMaroon text-white p-6 text-center relative">
            <h1 class="text-3xl font-bold tracking-wider italic">Arovia</h1>
            <p class="text-[10px] tracking-widest text-pink-200 uppercase mt-1">Explore • Experience • Preserve</p>
        </div>

        <div class="flex border-b border-gray-100 bg-gray-50">
            <button id="loginTabBtn" onclick="switchTab('login')" class="flex-1 py-3.5 text-xs font-bold uppercase tracking-wider text-aroviaMaroon border-b-2 border-aroviaMaroon transition bg-white">
                Sign In
            </button>
            <button id="signupTabBtn" onclick="switchTab('signup')" class="flex-1 py-3.5 text-xs font-bold uppercase tracking-wider text-gray-400 border-b-2 border-transparent transition hover:text-gray-600">
                Sign Up
            </button>
        </div>

        <div class="p-8">
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Email Address</label>
                    <div class="relative">
                        <input type="email" id="loginEmail" required placeholder="enter email" class="w-full py-3 pl-10 pr-4 text-sm bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-aroviaMaroon focus:bg-white transition">
                        <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <input type="password" required placeholder="••••••••" class="w-full py-3 pl-10 pr-4 text-sm bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-aroviaMaroon focus:bg-white transition">
                        <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                    </div>
                </div>
                <button type="submit" class="w-full py-3.5 bg-aroviaMaroon text-white font-semibold rounded-xl text-sm shadow-lg hover:bg-aroviaDarkMaroon transition">
                    Sign In
                </button>
            </form>

            <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Full Name</label>
                    <div class="relative">
                        <input type="text" id="signupName" required placeholder="enter full name" class="w-full py-3 pl-10 pr-4 text-sm bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-aroviaMaroon focus:bg-white transition">
                        <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Email Address</label>
                    <div class="relative">
                        <input type="email" required placeholder="name@example.com" class="w-full py-3 pl-10 pr-4 text-sm bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-aroviaMaroon focus:bg-white transition">
                        <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Create Password</label>
                    <div class="relative">
                        <input type="password" required placeholder="••••••••" class="w-full py-3 pl-10 pr-4 text-sm bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-aroviaMaroon focus:bg-white transition">
                        <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                    </div>
                </div>
                <button type="submit" class="w-full py-3.5 bg-aroviaMaroon text-white font-semibold rounded-xl text-sm shadow-lg hover:bg-aroviaDarkMaroon transition">
                    Create Account
                </button>
            </form>

            <div class="relative my-6 text-center">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
                <span class="relative px-4 bg-white text-[11px] text-gray-400 uppercase tracking-widest">Or continue with</span>
            </div>

            <button onclick="handleGoogleAuth()" class="w-full py-3 px-4 bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 font-semibold rounded-xl text-sm flex items-center justify-center gap-3 shadow-sm transition">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.3 7.23 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.12 0 9.99 0 12s.43 3.88 1.19 5.42l4.09-3.15z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.7 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                </svg>
                Continue with Google
            </button>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginTabBtn = document.getElementById('loginTabBtn');
            const signupTabBtn = document.getElementById('signupTabBtn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                loginTabBtn.className = "flex-1 py-3.5 text-xs font-bold uppercase tracking-wider text-aroviaMaroon border-b-2 border-aroviaMaroon transition bg-white";
                signupTabBtn.className = "flex-1 py-3.5 text-xs font-bold uppercase tracking-wider text-gray-400 border-b-2 border-transparent transition hover:text-gray-600 bg-gray-50";
            } else {
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                signupTabBtn.className = "flex-1 py-3.5 text-xs font-bold uppercase tracking-wider text-aroviaMaroon border-b-2 border-aroviaMaroon transition bg-white";
                loginTabBtn.className = "flex-1 py-3.5 text-xs font-bold uppercase tracking-wider text-gray-400 border-b-2 border-transparent transition hover:text-gray-600 bg-gray-50";
            }
        }

        function handleSignup(event) {
            event.preventDefault();
            const name = document.getElementById('signupName').value;
            localStorage.setItem('aroviaUserName', name);
            window.location.href = 'dashboard.html';
        }

        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            let nameFromEmail = email.split('@')[0];
            nameFromEmail = nameFromEmail.charAt(0).toUpperCase() + nameFromEmail.slice(1);
            localStorage.setItem('aroviaUserName', nameFromEmail);
            window.location.href = 'dashboard.html';
        }

        function handleGoogleAuth() {
            localStorage.setItem('aroviaUserName', 'Samyak');
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
